apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: student-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: <dockerhub-user>/sms-backend:1.0
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: backend-secret
          env:
            - name: FLASK_ENV
              value: production
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: student-portal
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000